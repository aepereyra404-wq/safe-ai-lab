version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /bin
    - /lib
    - /etc
  read_write:
    - /tmp/sandbox-ollama

landlock:
  compatibility: enforced

network_policies:
  ollama:
    name: ollama
    binaries:
      - path: /usr/bin/node
    endpoints:
      - host: ollama.com
        port: 443
        allow_uninspected_credentials: false
